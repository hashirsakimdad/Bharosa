<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:520px;background:#faf7f2;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c1917;overflow:hidden;position:relative}
.cap{position:absolute;left:64px;top:96px;width:470px}
.eb{font-size:20px;font-weight:700;letter-spacing:3px;color:#78716c}
.h{font-size:52px;font-weight:800;line-height:1.05;margin-top:14px;letter-spacing:-1px}
.s{font-size:22px;color:#57534e;margin-top:18px;line-height:1.45}
.steps{position:absolute;left:64px;bottom:64px;display:flex;gap:10px}
.st{font-size:17px;font-weight:600;padding:8px 14px;border-radius:999px;border:2px solid #d6d3d1;color:#a8a29e;background:#fff}
.st.on{border-color:#1c1917;background:#1c1917;color:#fff}
.phone{position:absolute;right:96px;top:16px;width:440px;height:488px;border:12px solid #1c1917;border-radius:44px;background:#faf7f2;padding:20px;overflow:hidden}
.top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#78716c}
.msg{margin-top:12px;background:#fff;border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.4;min-height:74px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{margin-top:10px;border-radius:14px;padding:12px;text-align:center;font-weight:700;font-size:18px;color:#fff;background:#1c1917;position:relative;overflow:hidden}
.btn.busy{background:#78716c}.sw{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
.sig{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:6px 12px;margin-top:6px;font-size:16px}
.mk{width:24px;height:24px;border-radius:99px;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.v{margin-top:10px;border:3px solid;border-radius:20px;padding:12px 16px}
.vt{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}.dot{width:14px;height:14px;border-radius:99px}
.vr{font-size:16px;margin-top:4px}
.pay{margin-top:10px;background:#ffc439;color:#003087;border-radius:12px;padding:10px;text-align:center;font-weight:800;font-size:16px}
.caret{display:inline-block;width:2px;height:18px;background:#1c1917;vertical-align:-3px;margin-left:1px}
</style></head><body>
<div class="cap"><div class="eb" id="eb"></div><div class="h" id="h"></div><div class="s" id="s"></div></div>
<div class="steps"><span class="st" id="s1">Forward</span><span class="st" id="s2">AI reads</span><span class="st" id="s3">Rules decide</span><span class="st" id="s4">Answer</span></div>
<div class="phone" id="ph"></div>
<script>
const C={danger:["#fee2e2","#fca5a5","#b91c1c"],safe:["#dcfce7","#86efac","#15803d"]};
const MK={x:["#b91c1c","✕"],w:["#b45309","!"],o:["#15803d","✓"]};
const S=[
 {msg:"iPhone 15 Pro only $280. Pay in USDT, no COD. 5 people waiting!!",sig:[["x","Price 77% below market"],["x","Crypto wallet, no refunds"],["w","Pressure: \"5 people waiting\""]],tone:"danger",title:"Don't pay",reason:"Crypto only, and far too cheap.",
  cap:["SCAM CAUGHT","Don't pay,<br>and here's why.","Every warning sign is listed, and the seller can be reported in one tap."]},
 {msg:"Sony XM5 headphones, sealed, $329. PayPal or cash on delivery.",sig:[["o","Fair price for this item"],["o","Protected payment offered"],["o","No reports on this seller"]],tone:"safe",title:"Looks safe",reason:"Fair price and a protected way to pay.",pay:"Pay USD 329 safely with PayPal",
  cap:["SAFE SELLER","Looks safe?<br>Pay with PayPal.","The pay link goes straight to the seller, with buyer protection. Red never gets one."]}
];
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const SCENE=7.5;
window.render=(t)=>{
 const k=Math.floor(t/SCENE)%2, u=t%SCENE, s=S[k];
 const typeEnd=0.3+s.msg.length*0.028;
 const n=Math.min(s.msg.length,Math.max(0,Math.floor((u-0.3)/0.028)));
 const busy=u>typeEnd+0.2&&u<typeEnd+1.4;
 const sigStart=typeEnd+1.4;
 let html=`<div class="top"><span>BHAROSA</span><span>● live</span></div><div class="msg">"${s.msg.slice(0,n)}${n>=s.msg.length?'"':'<span class=caret></span>'}</div>`;
 html+=`<div class="btn ${busy?'busy':''}">${busy?'Checking...':'Check'}${busy?`<div class=sw style="left:${(((u-typeEnd-0.2)%0.9)/0.9*170-40)}%"></div>`:''}</div>`;
 s.sig.forEach((g,i)=>{const a=ease((u-sigStart-i*0.35)/0.35); if(a>0) html+=`<div class=sig style="opacity:${a};transform:translateY(${(1-a)*10}px)"><span class=mk style="background:${MK[g[0]][0]}">${MK[g[0]][1]}</span>${g[1]}</div>`});
 const va=ease((u-sigStart-1.3)/0.45);
 if(va>0){const c=C[s.tone];html+=`<div class=v style="opacity:${va};transform:scale(${0.94+0.06*va});background:${c[0]};border-color:${c[1]}"><div class=vt style="color:${c[2]}"><span class=dot style="background:${c[2]}"></span>${s.title}</div><div class=vr>${s.reason}</div>${s.pay?`<div class=pay>${s.pay}</div>`:''}</div>`}
 const fade=u>SCENE-0.4?1-(u-(SCENE-0.4))/0.4:1;
 ph.innerHTML=html; ph.style.opacity=1; [...ph.children].slice(1).forEach(e=>e.style.opacity=(parseFloat(e.style.opacity||1)*fade));
 eb.textContent=s.cap[0]; h.innerHTML=s.cap[1]; s_.innerHTML=s.cap[2];
 document.querySelector('.cap').style.opacity=Math.min(ease(u/0.5),fade<1?fade:1);
 const step=u<typeEnd?1:u<sigStart?2:u<sigStart+1.3?3:4;
 [1,2,3,4].forEach(i=>document.getElementById('s'+i).className='st'+(i===step?' on':''));
};
const s_=document.getElementById('s'); window.TOTAL=SCENE*2;
</script></body></html>
