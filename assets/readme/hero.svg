<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Bharosa: check the seller before the money goes</title>
  <desc id="d">A seller's message offering a 280 dollar iPhone for crypto gets a red Don't pay verdict; a fair headphones offer gets a green Looks safe verdict with a Pay safely with PayPal button.</desc>
  <defs>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
    <clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="#faf7f2"/>
    <!-- soft verdict glows -->
    <circle cx="860" cy="120" r="210" fill="#fee2e2" opacity=".55"/>
    <circle cx="1060" cy="360" r="200" fill="#dcfce7" opacity=".6"/>

    <!-- title block -->
    <text x="64" y="92" class="f" font-size="22" font-weight="700" letter-spacing="4" fill="#78716c">SCAM CHECKER FOR ONLINE BUYERS</text>
    <text x="60" y="186" class="f" font-size="96" font-weight="800" letter-spacing="-2" fill="#1c1917">Bharosa<tspan fill="#15803d">.</tspan></text>
    <text x="64" y="240" class="f" font-size="34" font-weight="700" fill="#1c1917">Check the seller before</text>
    <text x="64" y="282" class="f" font-size="34" font-weight="700" fill="#1c1917">the money goes.</text>
    <text x="64" y="326" class="f" font-size="21" fill="#57534e">Forward a message, screenshot, link or voice note.</text>
    <text x="64" y="354" class="f" font-size="21" fill="#57534e">Get red, yellow or green, with the reasons.</text>

    <!-- chat bubble -->
    <g transform="translate(660 44)">
      <rect width="300" height="98" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
      <text x="20" y="34" class="f" font-size="19" fill="#44403c">iPhone 15 Pro only $280.</text>
      <text x="20" y="60" class="f" font-size="19" fill="#44403c">Pay in USDT, no COD.</text>
      <text x="20" y="84" class="f" font-size="19" fill="#44403c">5 people waiting!!</text>
    </g>
    <!-- red verdict -->
    <g transform="translate(700 158)">
      <rect width="300" height="104" rx="22" fill="#fee2e2" stroke="#fca5a5" stroke-width="3"/>
      <circle cx="30" cy="38" r="9" fill="#b91c1c"/>
      <text x="50" y="47" class="f" font-size="28" font-weight="800" fill="#b91c1c">Don't pay</text>
      <text x="22" y="82" class="f" font-size="19" fill="#1c1917">77% below price, crypto only</text>
    </g>
    <!-- green verdict -->
    <g transform="translate(860 280)">
      <rect width="300" height="118" rx="22" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
      <circle cx="30" cy="36" r="9" fill="#15803d"/>
      <text x="50" y="45" class="f" font-size="28" font-weight="800" fill="#15803d">Looks safe</text>
      <rect x="20" y="62" width="260" height="40" rx="12" fill="#ffc439"/>
      <text x="150" y="88" text-anchor="middle" class="f" font-size="18" font-weight="800" fill="#003087">Pay safely with PayPal</text>
    </g>

    <text x="64" y="396" class="m" font-size="18" fill="#78716c">Gemini reads · fixed rules decide · stamped on Bitcoin</text>
  </g>
</svg>
